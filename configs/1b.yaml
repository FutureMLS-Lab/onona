# Four GPUs; adjust accumulation when changing global batch layout.
vocab_size: 50304
n_layer: 20
d_model: 2048
n_head: 16
n_kv_head: 8
qk_norm: true
rope_theta: 1000000.0
embed_mode: router_mos_tok
tie_embeddings: true
connection: prenorm
seq_len: 1024
data_dir: data/climbmix_1b
data_order: sequential
train_tokens: 0
batch_size: 8
grad_accum: 16
max_steps: 78800
lr: 0.0006
warmup_steps: 2000
schedule: wsd
cooldown_frac: 0.2
min_lr_ratio: 0.1
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
eval_every: 1000
eval_batches: 128
eval_batch_size: 8
compile: true
dtype: bfloat16
seed: 0
out_dir: runs
run_name: 1b_onona
ckpt_dir: checkpoints
ckpt_every: 1000
